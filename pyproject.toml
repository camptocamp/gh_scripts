[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-repositories-tool"
version = "0.1.0"
description = "CLI tool to export GitHub organisation repositories to CSV"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
  { name = "Alexandre Fayolle <alexandre.fayolle@camptocamp.com>" }
]

dependencies = [
  "PyGithub>=2,<3",
]

[project.optional-dependencies]
# Example: pip install github-repositories-tool[dev]
dev = [
  "pre-commit",
  "ruff",
  "pytest",
]

[project.scripts]
# Installs a console command `github-repositories`
# that runs the main() function from github_repositories.py
github-repositories = "c2c_gh_scripts.github_repositories:main"
github-repositories-update = "c2c_gh_scripts.github_repository_update:main"
github-users = "c2c_gh_scripts.github_users:main"
github-repo-maintain = "c2c_gh_scripts.github_repo_maintain:main"
hunt-business-robot = "c2c_gh_scripts.hunt_business_robot:main"
clear-github-action-cache = "c2c_gh_scripts.clear_github_action_cache:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["c2c_gh_scripts"]
